<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <form action="second.html">

        First Name:
        <input type="text" name="fname" placeholder="Enter your first name" required>

        Middle Name:
        <input type="text" name="mname" placeholder="Enter your middle name" required>

        Last Name:
        <input type="text" name="lname" placeholder="Enter your last name" required>

        <br><br>

        Age:
        <input type="number" name="age" required>

        <br><br>

        Phone:
        <input type="tel" name="phone" required>

        <br><br>

        Address:<br>
        <textarea name="address" cols="30" rows="5" placeholder="Enter your present address" required></textarea>

        <br><br>

        Email:
        <input type="email" name="email" required>

        <br><br>

        Password:
        <input type="password" name="password" required>

        <br><br>

        <h4>Gender</h4>

        <input type="radio" name="gender" value="Male" required> Male
        <input type="radio" name="gender" value="Female"> Female

        <br><br>

        <h4>Languages</h4>

        <input type="checkbox" name="language" value="Kannada"> Kannada
        <input type="checkbox" name="language" value="English"> English

        <br><br>

        Week:
        <input type="week" name="week">

        <br><br>

        Pick a Colour:
        <input type="color" name="color">

        <br><br>

        Range:
        <input type="range" name="range" min="0" max="100">

        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
